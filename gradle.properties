org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# 安卓侧的三个开关。
# useAndroidX：Compose Multiplatform 在安卓上解析出来的就是 androidx 构件，
#   不打开这个开关 AGP 会直接拒绝构建（报的是「contains AndroidX dependencies」，不是类冲突）。
# nonTransitiveRClass：R 类不互相传递，多模块下避免资源 id 撞名。
# jetifier：本项目没有上古 support-library 依赖，关掉能省一大截构建时间。
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# KMP 在 AGP 下会打印「Kotlin 目标与 Java 目标不一致」的告警；这里显式对齐到 17。
kotlin.mpp.androidSourceSetLayoutVersion=2
