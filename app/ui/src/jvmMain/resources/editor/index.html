<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /*
   * 笔记编辑页（Tiptap/ProseMirror in JavaFX WebView）。
   *
   * 段间距用 CSS margin（浏览器里正文是块级 DOM，空行本来就不在 DOM 里），
   * 这样能精确到和 Compose 正文一致的「1.4 倍行距」。
   *
   * 字体/字号/行高对齐 Compose 的 bodyLarge（16sp / 24sp）：
   *  - 字体用系统 UI 字体（-apple-system）：和 Compose Desktop 的默认字体一致；
   *  - 不要写 "PingFang SC" 这类具体字体名，JavaFX WebView 会把中文的字形映射弄坏，
   *    整页变乱码（踩过）。
   * 颜色留给 window.setTheme(...) 从 Compose 主题灌进来（默认值是浅色主题）。
   */
  :root {
    --bg: #faf6ec;
    --fg: #2b2b2b;
    --fg-soft: #6b6b6b;
    --accent: #4f6a12;
    --accent-soft: rgba(79, 106, 18, 0.62);
    --code-bg: #eee9dd;
    --border: #d8d2c4;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  #editor { padding: 20px 32px 120px 40px; outline: none; height: 100%; box-sizing: border-box; overflow-y: auto; }
  .ProseMirror { outline: none; }
  /* 段落之间只留 margin，DOM 里没有空行。24px 行高 + 10px 间距 ≈ 1.42 倍。 */
  .ProseMirror p { margin: 0 0 10px 0; }
  .ProseMirror h1 { font-size: 24px; line-height: 1.32; margin: 18px 0 12px 0; }
  .ProseMirror h2 { font-size: 21px; line-height: 1.32; margin: 16px 0 10px 0; }
  .ProseMirror h3 { font-size: 19px; line-height: 1.32; margin: 14px 0 8px 0; }
  .ProseMirror h4, .ProseMirror h5, .ProseMirror h6 { font-size: 16px; line-height: 1.32; margin: 12px 0 8px 0; }
  .ProseMirror ul, .ProseMirror ol { margin: 0 0 10px 0; padding-left: 1.4em; }
  .ProseMirror li { margin: 0; }
  .ProseMirror li p { margin: 0; }
  .ProseMirror pre { background: var(--code-bg); border-radius: 8px; padding: 12px 16px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.5; }
  .ProseMirror code { font-family: "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--code-bg); border-radius: 4px; padding: 1px 4px; }
  .ProseMirror blockquote { margin: 0 0 10px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--fg-soft); }
  /* AI 补全：{{…}} 折叠成绿字，左上/右下两颗大引号由伪元素画。 */
  .ai { color: var(--accent); }
  .ai::before { content: "\201C"; font-size: 22px; }
  .ai::after  { content: "\201D"; font-size: 22px; }
  /* [[概念]]：绿色 + 下划线（和 Compose 编辑器的标注样式保持一致）。 */
  .concept { color: var(--accent-soft); text-decoration: underline; }
  /* 段落标记（gutter）：给光标所在的顶层块挂 class + data-marker，
     由 CSS 的 ::before 画到左边距。用 node decoration 而不是 widget：
     列表项里 widget 的落点要跨 listItem/paragraph 下钻，位置算错就整块不显示。
     伪元素绝对定位，不占行高、不影响段间距。 */
  .ProseMirror .gutter-current {
    position: relative;
  }
  .ProseMirror .gutter-current::before {
    content: attr(data-marker);
    position: absolute;
    left: -36px;
    top: 0.05em;
    width: 26px;
    text-align: right;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-soft);
    opacity: 0.8;
    white-space: nowrap;
    pointer-events: none;
  }
  /* [[概念]] 补全浮层 */
  .concept-menu {
    position: fixed;
    z-index: 20;
    display: none;
    min-width: 190px;
    max-width: 280px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .concept-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .concept-item.selected { background: var(--code-bg); }
  .concept-item .concept-name { color: var(--fg); font-size: 14px; }
  .concept-item .concept-hint { color: var(--fg-soft); font-size: 11px; }
  /* / 斜杠命令浮层：和概念补全同一套外观 */
  .slash-menu {
    position: fixed;
    z-index: 20;
    display: none;
    min-width: 220px;
    max-width: 300px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .slash-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .slash-item.selected { background: var(--code-bg); }
  .slash-item .slash-label { color: var(--fg); font-size: 14px; }
  .slash-item .slash-hint { color: var(--fg-soft); font-size: 11px; }
  .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--fg-soft); opacity: 0.6; float: left; height: 0; pointer-events: none; }
  /* 表格：Tiptap 的表格节点，宿主不提供工具栏，只给最基础的边框与内边距。 */
  .ProseMirror table { border-collapse: collapse; margin: 0 0 10px 0; table-layout: fixed; width: auto; }
  .ProseMirror th, .ProseMirror td { border: 1px solid var(--border); padding: 4px 8px; min-width: 60px; vertical-align: top; }
  .ProseMirror th { background: rgba(127, 127, 127, 0.08); font-weight: 600; }
  .ProseMirror th p, .ProseMirror td p { margin: 0; }
  /* 任务清单：宿主不画工具栏，checkbox 用原生控件就行。 */
  .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 0.2em; }
  .ProseMirror ul[data-type="taskList"] li { display: flex; align-items: flex-start; gap: 6px; }
  .ProseMirror ul[data-type="taskList"] li > label { flex: 0 0 auto; margin-top: 2px; }
  .ProseMirror ul[data-type="taskList"] li > div { flex: 1 1 auto; }
  .ProseMirror ul[data-type="taskList"] li > div p { margin: 0; }
  /* AI 块：和行内 AI 一样用绿色大引号；整块左边一条淡绿竖线。 */
  .ProseMirror .ai-block { position: relative; margin: 0 0 10px 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent-soft); color: var(--accent); }
  .ProseMirror .ai-block::before { content: "\201C"; font-size: 22px; line-height: 1; }
  .ProseMirror .ai-block::after { content: "\201D"; font-size: 22px; line-height: 1; float: right; }
  .ProseMirror .ai-block p { margin: 0 0 4px 0; color: var(--accent); }
  /* 页面里的「菜单」：光标旁边的浮窗（Compose 浮层会被重量级 WebView 盖住，所以在 DOM 里画）。 */
  .shortcut-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.08); }
  .shortcut-panel { position: fixed; left: 0; top: 0; width: 340px; max-width: calc(100vw - 24px); max-height: min(60vh, 460px); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22); overflow: hidden; }
  .shortcut-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 8px 14px; border-bottom: 1px solid var(--border); }
  .shortcut-title { font-size: 13px; font-weight: 600; font-family: "SF Mono", Menlo, monospace; color: var(--fg); }
  .shortcut-hint { font-size: 11px; color: var(--fg-soft); opacity: 0.8; }
  .shortcut-list { flex: 1 1 auto; overflow-y: auto; padding: 6px 14px 18px 14px; }
  .shortcut-section { margin: 8px 0 3px 0; font-size: 11px; color: var(--fg-soft); }
  .shortcut-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .shortcut-action { font-size: 13px; color: var(--fg); }
  .shortcut-keys { flex: 0 0 auto; font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--fg-soft); background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .shortcut-list::-webkit-scrollbar { width: 8px; }
  .shortcut-list::-webkit-scrollbar-track { background: transparent; }
  .shortcut-list::-webkit-scrollbar-thumb { background: rgba(127, 127, 127, 0.28); border-radius: 999px; }
  /* 滚动条：不要系统大滑条；做成低对比度的透明胶囊，明暗主题都靠中性灰。 */
  #editor::-webkit-scrollbar { width: 10px; height: 10px; }
  #editor::-webkit-scrollbar-track { background: transparent; }
  #editor::-webkit-scrollbar-thumb { background: rgba(127, 127, 127, 0.30); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  #editor::-webkit-scrollbar-thumb:hover { background: rgba(127, 127, 127, 0.48); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  #editor::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  /* 数学：Tiptap Maths 的 node view（.tiptap-mathematics-render）里是 KaTeX 渲染结果。 */
  .ProseMirror [data-type="block-math"] { margin: 6px 0 12px 0; text-align: center; overflow-x: auto; overflow-y: hidden; }
  .ProseMirror [data-type="inline-math"] { padding: 0 1px; }
  .ProseMirror .block-math-error, .ProseMirror .inline-math-error { color: #c0392b; font-family: "SF Mono", Menlo, monospace; font-size: 0.92em; }
  .ProseMirror [data-type="block-math"].tiptap-mathematics-render--editable:hover, .ProseMirror [data-type="inline-math"].tiptap-mathematics-render--editable:hover { background: rgba(127, 127, 127, 0.10); border-radius: 4px; }
  /* 代码高亮：lowlight 输出 hljs-* class。色调按深浅主题都能看（默认深色主题）。 */
  .ProseMirror pre code { display: block; background: none; padding: 0; border-radius: 0; }
  .hljs-comment, .hljs-quote { color: #7f848e; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag { color: #c678dd; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: #98c379; }
  .hljs-number, .hljs-symbol, .hljs-variable, .hljs-template-variable, .hljs-link { color: #d19a66; }
  .hljs-title, .hljs-section, .hljs-title.function_, .hljs-title.class_ { color: #61afef; }
  .hljs-type, .hljs-built_in, .hljs-class .hljs-title { color: #e5c07b; }
  .hljs-attr, .hljs-property { color: #56b6c2; }
  .hljs-deletion { color: #e06c75; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }
  /* 行首缩进在 pre 里靠 white-space: pre；保持原样。 */
</style></head>
<body><div id="editor"></div></body></html>
